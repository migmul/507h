{% extends "base.html" %}
{% block title %}Connexion – 507h{% endblock %}
{% block body %}
<main class="auth card">
  <h1>507<span>h</span></h1>
  <p class="muted">Suis ton parcours d'intermittent, simplement.</p>
  <div class="tabs">
    <button type="button" id="tab-login" class="active">Connexion</button>
    <button type="button" id="tab-register">Inscription</button>
  </div>
  <form id="auth-form" novalidate>
    <label>Email
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <label>Mot de passe
      <input type="password" name="password" minlength="12" autocomplete="current-password" required>
    </label>
    <p class="muted small" id="pwd-hint" hidden>12 caractères minimum.</p>
    <p class="error" id="auth-error" role="alert"></p>
    <button class="primary" type="submit" id="auth-submit">Se connecter</button>
  </form>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
