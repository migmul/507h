{% extends "base.html" %}
{% block title %}Mes contrats – 507h{% endblock %}
{% block body %}
<main class="container">
    <section class="card">
        <h2>Ma progression</h2>
        <div class="progress"><div id="bar"></div></div>
        <p><strong id="hours">0</strong> / 507 h
            <span class="muted" id="range"></span></p>
        <p class="muted small" id="remaining"></p>
        <p class="muted small" id="mode"></p>
    </section>

    <section class="card">
        <div class="card-head">
            <h2>Mes contrats</h2>
            <button class="primary inline" id="add-btn" type="button">+ Ajouter un contrat</button>
        </div>

        <div class="toolbar">
            <input id="q" class="grow" type="search" placeholder="Rechercher (employeur, mission, commentaire)" aria-label="Rechercher">
            <select id="f-year" aria-label="Année"></select>
            <select id="f-employer" aria-label="Employeur"></select>
            <select id="f-status" aria-label="Statut">
                <option value="">Tous les contrats</option>
                <option value="dup">Doublons possibles</option>
                <option value="nonet">Sans brut ou net</option>
                <option value="nodoc">Sans document</option>
            </select>
            <label class="check"><input type="checkbox" id="group" checked> Par année</label>
            <button class="ghost" id="reset-filters" type="button" hidden>Réinitialiser</button>
        </div>
        <p class="muted small" id="result-info"></p>

        <div class="table-wrap">
            <table>
                <thead><tr id="head-row"></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
        <p class="muted" id="empty" hidden></p>
    </section>
</main>

<dialog id="contract-dialog">
    <form id="contract-form" novalidate>
        <div class="card-head">
            <h2 id="form-title">Ajouter un contrat</h2>
            <button type="button" class="ghost" id="close-dialog" aria-label="Fermer">✕</button>
        </div>
        <input type="hidden" name="id">

        <div class="full">
            <label>Employeur
                <input name="employer" maxlength="120" list="employers" autocomplete="off" required>
            </label>
            <datalist id="employers"></datalist>
            <div id="employer-chips" class="chips" aria-label="Employeurs récents"></div>
        </div>

        <label>Mission (optionnel) <input name="mission" maxlength="160"></label>
        <label>Heures <input name="hours" type="number" step="0.5" min="0.5" required></label>
        <label>Début <input name="start_date" type="date" required></label>
        <label>Fin <input name="end_date" type="date" required></label>
        <label>Brut (€, optionnel) <input name="gross" type="number" step="0.01" min="0"></label>
        <label>Net (€, optionnel) <input name="net" type="number" step="0.01" min="0"></label>

        <label class="full">Commentaire (optionnel)
            <textarea name="comment" rows="3" maxlength="500"></textarea>
        </label>

        <fieldset class="full">
            <legend>Documents PDF (optionnel, 10 Mo max chacun)</legend>
            <label>Contrat de travail <input type="file" name="file_contrat" accept="application/pdf,.pdf"></label>
            <label>AEM <input type="file" name="file_aem" accept="application/pdf,.pdf"></label>
            <label>Bulletin de paie <input type="file" name="file_bulletin" accept="application/pdf,.pdf"></label>
            <ul id="existing-docs" class="docs"></ul>
        </fieldset>

        <div class="alert warn full" id="dup-warning" role="alert" hidden></div>
        <p class="error full" id="form-error" role="alert"></p>
        <div class="row full">
            <button class="primary inline" type="submit" id="save-btn">Enregistrer</button>
            <button class="ghost" type="button" id="cancel">Annuler</button>
        </div>
    </form>
</dialog>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
